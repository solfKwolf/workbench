name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    # PostgreSQL 服务容器（UserMapperTest 是 @SpringBootTest，需要真实 DB + Flyway 迁移）
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: workbench
        ports:
          - 5432:5432
        # 健康检查：确保 PostgreSQL 就绪再跑测试
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Spring Boot 自动映射：DB_URL → spring.datasource.url
    env:
      DB_URL: jdbc:postgresql://localhost:5432/workbench
      DB_USERNAME: postgres
      DB_PASSWORD: 123456
      # JWT 密钥必须 >= 32 字节，否则 JwtUtil 启动抛 WeakKeyException
      JWT_SECRET: workbench-ci-jwt-secret-key-must-be-at-least-32-bytes-long!
      JWT_EXPIRATION: 7200

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests
        run: mvn clean test -B

      # 上传测试报告（即使测试失败也上传，方便在 PR 里查看）
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            target/surefire-reports/*.txt
            target/surefire-reports/*.xml
          retention-days: 7
