server:
  port: 8090   # 8080 常被本机代理/前端 dev server 占用，固定用 8090

spring:
  application:
    name: workbench
  profiles:
    active: dev

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true   # created_at <-> createdAt 自动映射

management:
  endpoints:
    web:
      exposure:
        include: health   # 最小暴露面，仅健康检查
