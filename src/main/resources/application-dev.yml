spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workbench}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 控制台打印 SQL（学习期友好）

logging:
  level:
    com.workbench: debug

jwt:
  # HS256 要求密钥 >= 256 bit（32 字节），否则启动抛 WeakKeyException
  secret: ${JWT_SECRET:workbench-dev-jwt-secret-key-must-be-at-least-32-bytes-long!}
  expiration: ${JWT_EXPIRATION:7200}
  header: Authorization
  prefix: "Bearer "
