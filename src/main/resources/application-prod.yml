spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workbench}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}        # 无默认值：不设置则拒绝启动（防误连）
  flyway:
    enabled: true

# 生产关闭 API 文档端点，减少攻击面（鉴权是根本，但没必要公开接口地图）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

knife4j:
  enable: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl   # 生产关闭 SQL 日志

jwt:
  secret: ${JWT_SECRET}
  expiration: 7200
  header: Authorization
  prefix: "Bearer "
